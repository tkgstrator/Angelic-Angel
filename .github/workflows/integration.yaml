name: Integration
on:
  push:
    branches-ignore:
      - master
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      ci-force-heavy:
        description: Run full validation when called by another workflow.
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CLAUDE.md","README.md","docs/development/ci-change-scope.md","docs/superpowers/plans/2026-10-10-webui.md","docs/superpowers/specs/2026-10-10-webui-design.md"]'
      doc-prefixes: '[]'
      runner: '"ubuntu-latest"'
      force-heavy: ${{ inputs['ci-force-heavy'] == true }}

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-24.04
    # Skip master, tags, manual and reusable (release) runs.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install commitlint
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/commitlint" @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
      - name: Validate commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            from=$PR_BASE_SHA
            to=$PR_HEAD_SHA
          else
            to=$PUSH_HEAD
            from=$PUSH_BEFORE
            if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
              git fetch --no-tags origin master
              from=$(git merge-base origin/master "$to")
            fi
          fi
          export NODE_PATH="$RUNNER_TEMP/commitlint/node_modules"
          "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config .commitlintrc.yaml --from "$from" --to "$to" --verbose

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Clippy
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Install build dependencies
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
      - uses: dtolnay/rust-toolchain@master
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: cargo clippy
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  test:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Test
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Install build dependencies
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
      - uses: dtolnay/rust-toolchain@master
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: cargo test
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: cargo test --locked --all-targets --all-features

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  docker:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Docker Smoke
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Build image
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: angelic-angel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: scripts/docker-smoke.sh angelic-angel:ci

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
