services:
  angelic-angel:
    build: .
    image: angelic-angel:local
    restart: unless-stopped
    stop_signal: SIGINT
    # Optional; requires Docker Compose 2.24+ for `required: false`.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Mount the directory, not the file: saves go through a temp file + rename, and the
    # lock and the notification history live next to the config. It must be writable by
    # UID 65532 (`sudo chown 65532:65532 config`).
    volumes:
      - ./config:/config
